    function HireSyncApp() {
      // Auth State
      const [token, setToken] = useState(() => localStorage.getItem('hs_token'));
      const [currentUser, setCurrentUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem('hs_user')); } catch { return null; }
      });
      
      // Active Portal: 'auth' | 'candidate' | 'hr'
      const [activePortal, setActivePortal] = useState(() => {
        const saved = localStorage.getItem('hs_user');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            return parsed.role === 'RECRUITER' ? 'hr' : 'candidate';
          } catch { return 'auth'; }
        }
        return 'auth';
      });

      const handleLoginSuccess = (userData, jwtToken) => {
        localStorage.setItem('hs_token', jwtToken);
        localStorage.setItem('hs_user', JSON.stringify(userData));
        setToken(jwtToken);
        setCurrentUser(userData);

        // Smart Automatic Role Redirection!
        if (userData.role === 'RECRUITER') {
          setActivePortal('hr');
        } else {
          setActivePortal('candidate');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('hs_token');
        localStorage.removeItem('hs_user');
        setToken(null);
        setCurrentUser(null);
        setActivePortal('auth');
      };

      const switchPortal = (portal) => {
        setActivePortal(portal);
      };

      if (activePortal === 'auth' || !currentUser) {
        return (
          <UnifiedAuthHub
            onLoginSuccess={handleLoginSuccess}
            onFastSwitchToPortal={(portal, demoUser) => {
              handleLoginSuccess(demoUser, 'demo_jwt_token_signature_preview');
              setActivePortal(portal);
            }}
          />
        );
      }

      if (activePortal === 'candidate') {
        return (
          <CandidatePortalShell
            user={currentUser}
            onLogout={handleLogout}
            onSwitchToHR={() => setActivePortal('hr')}
          />
        );
      }

      if (activePortal === 'hr') {
        return (
          <HRCommandCenterShell
            user={currentUser}
            onLogout={handleLogout}
            onSwitchToCandidate={() => setActivePortal('candidate')}
          />
        );
      }

      return null;
    }

              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password }),

            onLoginSuccess(data.user, data.token);

              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email, password, role, fullName,

              role,
              profile: { fullName, companyName: role === 'RECRUITER' ? companyName : undefined }

            setIsLoading(false);
          }

          </header>

          {/* Main Auth Container */}
          <main className="max-w-5xl w-full mx-auto my-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">

            )}

            {/* DETAILED APPLICANT MATCH SCORECARD MODAL (Workday/Greenhouse Style) */}
            {selectedApplicant && (
              <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-2xl w-full p-6 sm:p-8 space-y-6 shadow-2xl animate-slide-up max-h-[90vh] overflow-y-auto custom-scroll">
                  {/* Modal Header */}
                  <div className="flex items-start justify-between border-b border-slate-800 pb-4">
                    <div className="flex items-center gap-3">
                      <img src={selectedApplicant.candidateAvatar} className="w-12 h-12 rounded-full object-cover border border-slate-700" />
                      <div>
                        <h3 className="text-xl font-bold text-white">{selectedApplicant.candidateName}</h3>
                        <p className="text-xs text-slate-400">{selectedApplicant.candidateEmail} • {selectedApplicant.degree}</p>
                      </div>
                    </div>
                    <button
                      onClick={() => setSelectedApplicant(null)}
                      className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center font-bold"
                    >
                      ×
                    </button>
                  </div>

                  {/* Score Matrix */}
                  <div className="grid grid-cols-4 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center">
                    <div>
                      <div className="text-2xl font-black text-emerald-400">{selectedApplicant.matchScore}%</div>
                      <div className="text-[10px] uppercase font-bold text-slate-400">Total Match</div>
                    </div>
                    <div>
                      <div className="text-xl font-bold text-slate-200">{selectedApplicant.skillsScore}%</div>
                      <div className="text-[10px] uppercase font-bold text-slate-400">Skills (50%)</div>
                    </div>
                    <div>
                      <div className="text-xl font-bold text-slate-200">{selectedApplicant.experienceScore}%</div>
                      <div className="text-[10px] uppercase font-bold text-slate-400">Exp (30%)</div>
                    </div>
                    <div>
                      <div className="text-xl font-bold text-slate-200">{selectedApplicant.educationScore}%</div>
                      <div className="text-[10px] uppercase font-bold text-slate-400">Edu (20%)</div>
                    </div>
                  </div>

                  {/* Skills Match Matrix */}
                  <div className="space-y-3">
                    <div>
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Matched Required Skills</div>
                      <div className="flex flex-wrap gap-2">
                        {selectedApplicant.matchedSkills.map(s => (
                          <span key={s} className="px-2.5 py-1 bg-emerald-950 border border-emerald-800 text-emerald-300 rounded-lg text-xs font-semibold flex items-center gap-1">
                            <span>✓</span> {s}
                          </span>
                        ))}
                      </div>
                    </div>

                    {selectedApplicant.missingSkills.length > 0 && (
                      <div>
                        <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Missing Skills</div>
                        <div className="flex flex-wrap gap-2">
                          {selectedApplicant.missingSkills.map(s => (
                            <span key={s} className="px-2.5 py-1 bg-red-950 border border-red-800 text-red-300 rounded-lg text-xs font-semibold flex items-center gap-1">
                              <span>×</span> {s}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Anti-Gaming Audit Log */}
                  <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-xs space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-white">🛡️ Anti-Gaming System Inspection Log</span>
                      {selectedApplicant.antiGaming.flagged ? (
                        <span className="px-2 py-0.5 bg-amber-950 text-amber-300 text-[10px] font-bold rounded">⚠️ Flagged</span>
                      ) : (
                        <span className="px-2 py-0.5 bg-emerald-950 text-emerald-300 text-[10px] font-bold rounded">✓ Clean</span>
                      )}
                    </div>
                    {selectedApplicant.antiGaming.flagged ? (
                      <div className="text-amber-300">{selectedApplicant.antiGaming.flags[0].description}</div>
                    ) : (
                      <div className="text-slate-400">Zero white fonting, tiny font manipulation, or adversarial prompt injections found in parsed binary.</div>
                    )}
                  </div>

                  {/* Decision Actions */}
                  <div className="flex justify-end gap-3 pt-2 border-t border-slate-800">
                    <button
                      onClick={() => { alert('Candidate marked rejected.'); setSelectedApplicant(null); }}
                      className="px-4 py-2 bg-red-950 hover:bg-red-900 border border-red-800 text-red-300 font-bold text-xs rounded-xl"
                    >
                      Reject Candidate
                    </button>
                    <button
                      onClick={() => { alert('Candidate advanced to Live WebRTC Interview!'); setSelectedApplicant(null); }}
                      className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/20"
                    >
                      Advance to Live Interview →
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    // Mount Root Component
    ReactDOM.createRoot(document.getElementById('root')).render(<HireSyncApp />);
  </script>
</body>
</html>
